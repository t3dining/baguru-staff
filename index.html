<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- バグる Staff は https://t3dining-store.github.io/baguru-staff/ へ引っ越す（お店用アプリの引っ越し。../../お店用アプリの引っ越し.md）。
     ★引っ越しの日まで出さない（用意だけ）。いまは公開の一覧（道具/公開する.py の HUB_PUBLISH）に入っていないので、どこにも出ない。
     引っ越しの日に、前の公開先 t3dining/baguru-staff の index.html として出す。
     前のアドレス（https://t3dining.github.io/baguru-staff/）は公式アプリと保存場所が同じなので、開いたら、ここに残ったお店の保存を消して、新しいアドレスへのボタンを出す。
     ★自動では移らない（ホーム画面のアイコンを入れ直してもらうため） -->
<title>バグる Staff</title>
<script>
  (function () {
    // ★名前を1つずつ消す（bg. で始まる名前は、公式アプリのお客様の保存にも使っている。まとめて消さない）。
    // 社員のスマホは、Staff の古いアイコンしか開かないことがあるので、ここで、お店のアプリが残した保存を全部消す（計画書の「古い場所で消すもの」の表）。
    // bg.owner は公式アプリの 🏠 も読んでいたが、引っ越しの日には、公式アプリはアドレスの印だけで戻る形に直っている（段階2の3）
    var KEYS = ['baguru.daicho.pin', 'baguru.line.screen', 'bg.hpAdmin', 'baguru.yoyaku.owner', 'baguru.yoyaku.view',
                'baguru.daicho.seen', 'baguru.daicho.sound', 'baguru.daicho.shell',   // shell には今日の予約の控え（お客様のお名前）が入る
                'bg.cookRung', 'bg.hub', 'bg.owner'];
    KEYS.forEach(function (k) {
      try { localStorage.removeItem(k); } catch (e) {}
      try { sessionStorage.removeItem(k); } catch (e) {}
    });
  })();
</script>
</head>
<body style="margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#faf6f0;color:#221c18;font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;text-align:center;line-height:1.7">
<div style="max-width:420px">
  <p style="font-size:20px;font-weight:700;margin:0 0 12px">バグる Staff は、<br>新しいアドレスに引っ越しました</p>
  <p style="margin:0 0 8px;color:#675d55">ホーム画面に入れているときは、このアイコンを消して、新しいアドレスから入れ直してください。</p>
  <p style="margin:0 0 24px;color:#675d55">予約ボード・Order受付・LINE引き継ぎの合言葉は、新しいアドレスで開いたときに、もう一度入れてください。</p>
  <a href="https://t3dining-store.github.io/baguru-staff/" style="display:inline-block;padding:14px 32px;border-radius:999px;background:#c7361d;color:#fff;font-size:17px;font-weight:700;text-decoration:none">新しいアドレスで開く</a>
  <p style="margin:20px 0 0;font-size:13px;color:#a3988e;">新しいアドレス<br>t3dining-store.github.io/baguru-staff/</p>
</div>
</body>
</html>
